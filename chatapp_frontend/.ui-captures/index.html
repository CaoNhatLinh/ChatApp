<!doctype html>
<html>
<head>
  <meta charset='utf-8'/>
  <title>ChatApp UI Captures</title>
  <style>
    body { font-family: Arial, sans-serif; background:#0b1020; color:#e2e8f0; padding:20px; }
    h1 { margin: 0 0 12px; }
    .group { margin-bottom: 32px; }
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px,1fr)); gap: 16px; }
    figure { margin: 0; background: #111827; border: 1px solid #2d3748; border-radius: 10px; padding: 10px; }
    img { width: 100%; height: auto; border-radius: 8px; border: 1px solid #1f2937; display:block; background:#111; }
    figcaption { margin-top: 8px; font-size: 12px; color:#cbd5e1; }
  </style>
</head>
<body>
  <h1>ChatApp UI Captures</h1>
  <div class='cards'>
    <figure><img src='home-desktop.png' alt='home-desktop'><figcaption>home-desktop</figcaption></figure>
    <figure><img src='home-mobile.png' alt='home-mobile'><figcaption>home-mobile</figcaption></figure>
    <figure><img src='home-alt-desktop.png' alt='home-alt-desktop'><figcaption>home-alt-desktop</figcaption></figure>
    <figure><img src='home-alt-mobile.png' alt='home-alt-mobile'><figcaption>home-alt-mobile</figcaption></figure>

    <figure><img src='not-found-alt-mobile.png' alt='not-found-alt-mobile'><figcaption>not-found-alt-mobile</figcaption></figure>
