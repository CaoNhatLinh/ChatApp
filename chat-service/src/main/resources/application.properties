spring.application.name=chat-service
app.public-base-url=${APP_PUBLIC_BASE_URL:http://localhost:5173}
server.port=8084

# Multipart Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

# Cassandra Configuration
spring.cassandra.keyspace-name=chat_app
spring.cassandra.contact-points=${CASSANDRA_CONTACT_POINTS:localhost}
spring.cassandra.port=${CASSANDRA_PORT:9042}
spring.cassandra.local-datacenter=${CASSANDRA_LOCAL_DATACENTER:datacenter1}
spring.cassandra.schema-action=none
spring.cassandra.request.timeout=${CASSANDRA_REQUEST_TIMEOUT:5s}

# Redis: canonical store for ephemeral presence, typing, cache, and distributed rate limits
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=${REDIS_TIMEOUT:2s}
spring.cache.type=redis
app.redis.typing-ttl=${REDIS_TYPING_TTL:8s}
app.redis.typing-channel=${REDIS_TYPING_CHANNEL:chat:realtime:typing}
app.redis.presence-ttl=${REDIS_PRESENCE_TTL:70s}

# Authenticated STOMP/SockJS realtime endpoint
app.websocket.allowed-origin-patterns=${WEBSOCKET_ALLOWED_ORIGIN_PATTERNS:http://localhost:3000,http://localhost:5173}
app.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:3000,http://localhost:5173}

# Kafka: durable domain events published from the Cassandra outbox
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP:chat-service}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
app.integrations.kafka.enabled=${KAFKA_ENABLED:true}
app.kafka.topics.domain-events=${KAFKA_DOMAIN_EVENTS_TOPIC:chat.domain-events.v1}
app.kafka.topics.dead-letter=${KAFKA_DEAD_LETTER_TOPIC:chat.domain-events.dlt.v1}
app.kafka.topics.partitions=${KAFKA_TOPIC_PARTITIONS:6}
app.kafka.topics.replication-factor=${KAFKA_TOPIC_REPLICATION_FACTOR:1}
app.kafka.outbox.poll-delay-ms=${KAFKA_OUTBOX_POLL_DELAY_MS:1000}
app.kafka.outbox.batch-size=${KAFKA_OUTBOX_BATCH_SIZE:100}
app.kafka.outbox.lookback-hours=${KAFKA_OUTBOX_LOOKBACK_HOURS:24}
app.kafka.outbox.send-timeout=${KAFKA_OUTBOX_SEND_TIMEOUT:10s}

# Elasticsearch: rebuildable and authorization-filtered search projection
spring.elasticsearch.uris=${ELASTICSEARCH_URIS:http://localhost:9200}
spring.elasticsearch.connection-timeout=${ELASTICSEARCH_CONNECTION_TIMEOUT:5s}
spring.elasticsearch.socket-timeout=${ELASTICSEARCH_SOCKET_TIMEOUT:30s}
app.integrations.elasticsearch.enabled=${ELASTICSEARCH_ENABLED:true}
app.elasticsearch.message-index=${ELASTICSEARCH_MESSAGE_INDEX:chat-messages-v1}
app.elasticsearch.conversation-index=${ELASTICSEARCH_CONVERSATION_INDEX:chat-conversations-v1}

# Cloudinary: binary object storage; Cassandra retains canonical asset metadata
app.integrations.cloudinary.enabled=${CLOUDINARY_ENABLED:false}
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
cloudinary.secure=true

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:900000}
app.auth.refresh-lifetime-ms=${AUTH_REFRESH_LIFETIME_MS:2592000000}
app.auth.cookie-secure=${AUTH_COOKIE_SECURE:false}
app.bootstrap.super-admin-user-id=${APP_BOOTSTRAP_SUPER_ADMIN_USER_ID:}

# Timed moderation sanctions are projected by UTC expiry day and processed by
# a bounded, retryable scheduler. Keep the defaults conservative for local use.
app.moderation.expiry-poll-delay-ms=${MODERATION_EXPIRY_POLL_DELAY_MS:60000}
app.moderation.expiry-lookback-days=${MODERATION_EXPIRY_LOOKBACK_DAYS:31}
app.moderation.expiry-batch-size=${MODERATION_EXPIRY_BATCH_SIZE:100}

# Logging
#logging.level.com.chatapp.chat_service=INFO
#logging.level.org.springframework.security=DEBUG
#logging.level.org.springframework.kafka=INFO

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.health.elasticsearch.enabled=${ELASTICSEARCH_HEALTH_ENABLED:true}
management.health.redis.enabled=${REDIS_HEALTH_ENABLED:true}
