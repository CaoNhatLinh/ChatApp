    MessageSend:
      type: object
      required: [clientMessageId, messageType, content, contentFormat]
      description: GIF requires gif identity, empty PLAIN content and no sticker, poll or attachments. Non-GIF types reject gif. Replies require both a timeuuid replyToMessageId and its canonical replyToMessageBucket in the current conversation. The server resolves the parent sender; clients do not supply it. Missing, deleted or blocked sources return 404 before allocating a new message. Committed exact retries return the original child even if its parent was later deleted. The complete payload participates in idempotency; changed identity conflicts on the same clientMessageId.
      properties:
        clientMessageId: {type: string, format: uuid}
        messageType: {type: string, enum: [TEXT, IMAGE, FILE, AUDIO, VIDEO, STICKER, GIF, POLL, SYSTEM]}
        content: {type: string, maxLength: 20000}
        contentFormat: {type: string}
        replyToMessageId: {type: string, format: uuid, nullable: true}
        replyToMessageBucket: {type: string, pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}-[0-9]{2}:[0-9]{2}$', nullable: true}
        stickerId: {type: string, format: uuid, nullable: true}
        pollId: {type: string, format: uuid, nullable: true}
        gif: {allOf: [{$ref: '#/components/schemas/GifReference'}], nullable: true}
        forwardedFromConversationId: {type: string, format: uuid, nullable: true, description: Immediate source key. All three forward fields must be supplied together; server verifies source membership and exact snapshot before allocation.}
        forwardedFromMessageBucket: {type: string, nullable: true}
        forwardedFromMessageId: {type: string, format: uuid, nullable: true, description: Snapshot content/type/format/sticker/GIF and at most50 attachments must match source authority or409. No reply/mention semantics or POLL/SYSTEM copies. Exact committed retry precedes mutable source validation.}
        mentionedUserIds: {type: array, uniqueItems: true, items: {type: string, format: uuid}}
        mentionEveryone: {type: boolean, default: false}
        attachments:
          type: array
          items: {$ref: '#/components/schemas/MessageAttachmentRequest'}
          description: Exact canonical upload metadata, including nullable width/height/durationMs. A supplied thumbnailUrl must match a persisted READY variant of this asset, including for a source-authorized forward. Null thumbnail is allowed; missing/unavailable variants are not invented. Retry must retain the original complete command and clientMessageId, including mention fields.
    MessageAttachmentRequest:
      type: object
