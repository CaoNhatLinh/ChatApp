openapi: 3.1.0
info:
  title: Nối Canonical HTTP API
  version: 1.0.0
  description: |
    Source-controlled contract for the authenticated Nối web client.
    Cassandra remains authoritative; cursors are opaque and must not be decoded by clients.
    Protected endpoints return 401 for missing/invalid authentication; authenticated membership or permission denials remain 403.
servers:
  - url: http://localhost:8084/api
    description: Local development
tags:
  - name: Auth
  - name: Users
  - name: Friends
  - name: Conversations
  - name: Calls
  - name: Communities
  - name: Messages
  - name: Polls
  - name: Stickers
  - name: Invites
  - name: Notifications
  - name: Files
  - name: Search
  - name: Admin
  - name: Operations
security:
  - bearerAuth: []
paths:
  /admin/email-review:
    get:
      tags: [Admin]
      operationId: listAdminEmailReview
      summary: List email deliveries awaiting review
      description: Requires SYSTEM_OPERATE. Reads a UTC job creation day. Each page checks current delivery state, so resolved or missing entries may result in an empty page with a continuation cursor.
      parameters:
        - {name: day, in: query, schema: {type: string, format: date}, description: Defaults to the current UTC day}
        - {name: cursor, in: query, schema: {type: string, maxLength: 160}, description: Continuation for the same day}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 50, default: 20}}
      responses:
        '200':
          description: Redacted review entries. Cache-Control is no-store.
          content:
            application/json:
              schema:
                type: object
                required: [content, hasNext]
                properties:
                  content:
                    type: array
                    items:
                      type: object
                      required: [userId, month, notificationId, attempts]
                      properties:
                        userId: {type: string, format: uuid}
                        month: {type: string, pattern: '^(?!0000)[0-9]{4}-(0[1-9]|1[0-2])$'}
                        notificationId: {type: string, format: uuid}
                        attempts: {type: integer, minimum: 0}
                        attemptedAt: {type: string, format: date-time, nullable: true}
                  nextCursor: {type: string, nullable: true}
                  hasNext: {type: boolean}
        '400': {description: Invalid day, limit or cursor}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {description: Missing SYSTEM_OPERATE permission}
  /admin/email-review/{userId}/{month}/{notificationId}/disposition:
    put:
      tags: [Admin]
      operationId: closeAdminEmailReview
      summary: Close an uncertain delivery review
      description: Requires SYSTEM_OPERATE. Persists one operator receipt for the exact delivery. An identical command by the same operator returns the recorded time, including after a provider status update. Closing a review does not send email.
      parameters:
        - {name: userId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: month, in: path, required: true, schema: {type: string, pattern: '^(?!0000)[0-9]{4}-(0[1-9]|1[0-2])$'}}
        - {name: notificationId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [commandId, reason]
              properties:
                commandId: {type: string, format: uuid, description: Version 4 UUID}
                reason: {type: string, minLength: 1, maxLength: 300, description: Required after trimming}
      responses:
        '200':
          description: Receipt time. Cache-Control is no-store.
          content:
            application/json:
              schema:
                type: object
                required: [reviewedAt]
                properties:
                  reviewedAt: {type: string, format: date-time}
        '400': {description: Invalid lookup key or review command}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {description: Missing SYSTEM_OPERATE permission}
        '404': {description: No email delivery for the exact key}
        '409': {description: Delivery state or recorded review has changed}
  /admin/email-deliveries/{userId}/{month}/{notificationId}:
    get:
      tags: [Admin]
      operationId: getAdminEmailDelivery
      summary: Look up one email delivery
      description: Requires SYSTEM_OPERATE. Use the stored UTC notification month shown in the member's lookup details. This lookup does not alter delivery state.
      parameters:
        - {name: userId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: month, in: path, required: true, schema: {type: string, pattern: '^(?!0000)[0-9]{4}-(0[1-9]|1[0-2])$'}}
        - {name: notificationId, in: path, required: true, description: Notification timeuuid, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Redacted delivery state. Cache-Control is no-store.
          content:
            application/json:
              schema:
                type: object
                required: [status, attempts]
                properties:
                  status: {type: string, enum: [PENDING, SENDING, RETRY, SENT, DELAYED, DELIVERED, FAILED, BOUNCED, COMPLAINED, SUPPRESSED, SKIPPED, REVIEW_REQUIRED, UNKNOWN]}
                  attempts: {type: integer, minimum: 0}
                  attemptedAt: {type: string, format: date-time, nullable: true}
                  retryAt: {type: string, format: date-time, nullable: true}
                  deliveredAt: {type: string, format: date-time, nullable: true}
                  reviewedAt: {type: string, format: date-time, nullable: true}
        '400': {description: Invalid lookup key}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {description: Missing SYSTEM_OPERATE permission}
        '404': {description: No email delivery for the exact key}
  /admin/system-settings:
    get:
      tags: [Admin]
      summary: Read the finite non-secret system setting catalog
      description: Requires SYSTEM_OPERATE. No-store. Two allowlisted settings only; a never-written setting has the documented zero UUID revision and null update metadata. No arbitrary keys or environment secrets are exposed.
      responses:
        '200': {description: Complete finite catalog, content: {application/json: {schema: {type: array, minItems: 2, maxItems: 2, items: {$ref: '#/components/schemas/SystemSetting'}}}}}
        '403': {description: SYSTEM_OPERATE required}
  /admin/system-settings/{key}:
    put:
      tags: [Admin]
      summary: Commit one typed setting with revision CAS and durable audit intent
      description: Requires SYSTEM_OPERATE and no-store response. commandId is scoped to this key and actor/payload; exact replay never reapplies an older mutation and returns current authority. Stale expectedRevision conflicts without success audit. Audit export failure after commit returns auditPending=true and is retried from the same-partition durable command. Community settings affect only creation of new public communities, not existing rooms or DMs/private groups.
      parameters: [{name: key, in: path, required: true, schema: {type: string, enum: [community.creationEnabled, community.defaultMaxMembers]}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/SystemSettingUpdate'}}}}
      responses:
        '200': {description: Committed or exact replay receipt with current setting, content: {application/json: {schema: {$ref: '#/components/schemas/SystemSettingResult'}}}}
        '400': {description: Unknown key, invalid JSON value type/range or invalid command/reason}
        '403': {description: SYSTEM_OPERATE required}
        '409': {description: Stale revision or reused command with changed payload/actor; reload explicitly}
  /calls/history:
    get:
      tags: [Calls]
      summary: Page the authenticated participant's direct-call history for a UTC month
      description: |
        Actor comes only from authentication. Scan at most limit immutable actor/month keys,
        hydrate exact call authority and require current actor membership in an existing DM
        plus exact caller/callee participation. Archive, block or peer departure does not erase
        authorized history or grant contact permission. Inaccessible, missing and stale hints
        are filtered; full scanned-key continuation applies even to empty content. No frozen
        snapshot, total count or automatic cross-month scan. Overdue nonterminal calls expire
        through existing fenced authority CAS, never through a fabricated DTO outcome.
        Storage/invariant failure and sustained contention remain errors, not empty success.
      parameters:
        - {$ref: '#/components/parameters/CallHistoryMonth'}
        - {$ref: '#/components/parameters/CallHistoryCursor'}
        - {$ref: '#/components/parameters/CallHistoryLimit'}
      responses:
        '200': {$ref: '#/components/responses/CallHistoryPage'}
        '400': {$ref: '#/components/responses/CallHistoryInvalid'}
        '401': {description: Missing or invalid authentication, or account no longer active}
        '409': {$ref: '#/components/responses/CallHistoryConflict'}
        '500': {$ref: '#/components/responses/CallHistoryUnavailable'}
  /conversations/{conversationId}/calls/history:
    get:
      tags: [Calls]
      summary: Page a current member's direct-call history in one DM and UTC month
      description: Current actor membership and existing DM are checked even for an empty page. Each result must belong to the exact historical caller/callee. No peer-membership requirement, profile/presence disclosure or implied callback eligibility. Archive/block does not erase authorized history. The same bounded scanned-key continuation and fenced overdue expiry rules as own history apply.
      parameters:
        - {$ref: '#/components/parameters/ConversationId'}
        - {$ref: '#/components/parameters/CallHistoryMonth'}
        - {$ref: '#/components/parameters/CallHistoryCursor'}
        - {$ref: '#/components/parameters/CallHistoryLimit'}
      responses:
        '200': {$ref: '#/components/responses/CallHistoryPage'}
        '400': {$ref: '#/components/responses/CallHistoryInvalid'}
        '401': {description: Missing or invalid authentication, or account no longer active}
        '403': {$ref: '#/components/responses/CallHistoryForbidden'}
        '404': {$ref: '#/components/responses/CallHistoryNotFound'}
        '409': {$ref: '#/components/responses/CallHistoryConflict'}
        '500': {$ref: '#/components/responses/CallHistoryUnavailable'}
  /conversations/{conversationId}/calls/{callId}/history:
    get:
      tags: [Calls]
      summary: Read exact participant-authorized signaling history and two participant roles
      description: Call IDs are scoped to the conversation. Current actor membership, existing DM and exact historical participation are required; global admin status is not a bypass. Consent/signaling facts are not proof of media attendance or talk duration. The read may expire overdue authority by fenced CAS, never acquires devices or starts/answers/ends a call on behalf of the actor.
      parameters:
        - {$ref: '#/components/parameters/ConversationId'}
        - {name: callId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Exact current public signaling history
          headers: {Cache-Control: {schema: {type: string, const: no-store}}}
          content: {application/json: {schema: {$ref: '#/components/schemas/CallHistoryEntry'}}}
        '400': {$ref: '#/components/responses/CallHistoryInvalid'}
        '401': {description: Missing or invalid authentication, or account no longer active}
        '403': {$ref: '#/components/responses/CallHistoryForbidden'}
        '404': {$ref: '#/components/responses/CallHistoryNotFound'}
        '409': {$ref: '#/components/responses/CallHistoryConflict'}
        '500': {$ref: '#/components/responses/CallHistoryUnavailable'}
  /conversations/{conversationId}/summary:
    get:
      tags: [Conversations]
      summary: Open one conversation with the same member-scoped view as the directory
      description: Current membership is checked before reading and again before hydration. Uses the exact activity key and the user's pin slots without scanning earlier directory pages. Returns public DM peer fields, pin state, unread count and notification preference. Members can read archived conversations. A missing or moving projection returns a conflict.
      parameters:
        - {name: conversationId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Member-scoped conversation summary
          headers:
            Cache-Control: {schema: {type: string, const: no-store}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ConversationListItem'}
        '400': {description: Invalid conversation UUID}
        '401': {description: Missing or invalid authentication}
        '403': {description: Not a current member}
        '404': {description: Conversation authority is missing}
        '409': {description: Projection is unavailable, changing activity or moving between pin slots; retry the read}
        '500': {description: Storage or invariant failure; must not be treated as an empty summary}
  /calls/incoming:
    get:
      tags: [Calls]
      summary: Discover currently ringing direct calls addressed to the authenticated user
      description: |
        Actor identity comes only from the authenticated security context. Reads one callee partition
        without enumerating conversations. Each request scans at most limit discovery keys and rechecks
        the current slot, call authority, fixed ringing deadline, active direct conversation, both
        memberships, both block directions and both canonical accounts still ACTIVE. Missing or inaccessible calls are filtered. Datastore
        failures, unavailable authority and sustained contention remain errors, never an empty page.
        This is a live feed, not a historical or frozen snapshot; concurrent insertions have no promised
        snapshot position. Ringing eligibility ends 45 seconds after the server-created call time.
        Subscribe to private call state before lookup and merge snapshots by their canonical version.
        Follow nextCursor while hasNext is true, including when content is empty. A full scanned page
        returns a continuation even if the next request is empty. This read never starts or accepts a call,
        or acquires devices. The existing active-call authority read may expire an overdue call by fenced CAS.
      parameters:
        - name: cursor
          in: query
          description: Opaque actor-scoped continuation from the previous page. Expires 60 seconds after the initial lookup; restart without a cursor when expired. Do not construct or decode it.
          schema: {type: string, maxLength: 1024}
        - name: limit
          in: query
          description: Maximum discovery keys scanned in this request, including keys filtered from content.
          schema: {type: integer, minimum: 1, maximum: 50, default: 25}
      responses:
        '200':
          description: Current incoming-call page; an empty content array may still have a continuation
          headers:
            Cache-Control: {schema: {type: string, const: no-store}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/IncomingCallPage'}
        '400':
          description: Invalid limit or malformed, oversized, wrong-actor, future or expired cursor
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
        '401': {description: Missing or invalid authentication, or account no longer active}
        '409':
          description: Authority kept changing during bounded retries; retry discovery
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
        '500':
          description: Authority invariant, unavailable authority or datastore failure; must not be treated as no incoming calls
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
  /conversations/{conversationId}/calls/active:
    get:
      tags: [Conversations]
      summary: Find the current direct-call authority without knowing its call ID
      description: Current member and exact call participant only; rejects archived/non-DM rooms, current blocks in either direction and an existing call whose actor or peer canonical account is missing or not ACTIVE. Reads the slot and authority with bounded consistency retries; overdue calls expire by fenced CAS before returning absence. Account-store failures remain errors. Never initializes a slot, scans history, acquires devices, accepts a call or proves media connectivity. Responses are no-store; empty is 204, not an error or an unavailable store. Historical-read permission is a separate contract.
      parameters:
        - {name: conversationId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Current nonterminal call snapshot (point-in-time; may change immediately)
          headers:
            Cache-Control: {schema: {type: string, const: no-store}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CallSnapshot'}
        '204':
          description: No active call remains; no response body
          headers:
            Cache-Control: {schema: {type: string, const: no-store}}
        '400': {description: Invalid room UUID or unsupported non-DM room}
        '401': {description: Missing or invalid authentication}
        '403': {description: Not a current member/participant or blocked}
        '404': {description: Missing or archived conversation}
        '409': {description: Authority kept changing; retry the same read}
        '500': {description: Authority invariant/storage failure; must not be treated as absence}
  /conversations/{conversationId}/read-state:
    get:
      tags: [Conversations]
      summary: Read the authenticated member's authoritative entry marker
      parameters:
        - {name: conversationId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Membership read pointer; null message ID means no recorded read yet
          content:
            application/json:
              schema:
                type: object
                required: [lastReadMessageId, lastReadAt, joinedAt]
                properties:
                  lastReadMessageId: {type: string, format: uuid, nullable: true}
                  lastReadAt: {type: string, format: date-time, nullable: true}
                  joinedAt: {type: string, format: date-time}
        '401': {description: Missing or invalid authentication}
        '403': {description: Not a member}
  /conversations/{conversationId}/shared-content:
    get:
      tags: [Messages]
      summary: Browse authorized shared content from canonical history
      description: Bounded descending timeuuid scan across all shards in one hour. Empty pages can have continuation. Attachment continuation does not truncate large messages. Links are extracted from one message (maximum 20000 characters), without remote preview requests. Deleted messages, blocked senders and unavailable assets are excluded. There is no total count. Membership is checked again before returning a nonempty page.
      parameters:
        - {name: conversationId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: kind, in: query, schema: {type: string, enum: [IMAGES, FILES, LINKS], default: IMAGES}}
        - {name: cursor, in: query, schema: {type: string, maxLength: 1024}, description: Opaque actor/conversation/kind-scoped continuation}
      responses:
        '200':
          description: Member-scoped content page
          content:
            application/json:
              schema:
                type: object
                required: [content, hasNext, nextCursor]
                properties:
                  content: {type: array, items: {$ref: '#/components/schemas/SharedContentItem'}}
                  hasNext: {type: boolean}
                  nextCursor: {type: string, nullable: true}
        '400': {description: Invalid kind or cursor}
        '401': {description: Missing or invalid authentication}
        '403': {description: Membership missing or changed during the request}
  /conversations/{conversationId}/shared-content/{messageId}:
    get:
      tags: [Messages]
      summary: Open the source message with fresh membership and visibility checks
      parameters:
        - {name: conversationId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: messageId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: bucket, in: query, required: true, schema: {type: string, pattern: '^\d{4}-\d{2}-\d{2}-\d{2}:\d{2}$'}}
      responses:
        '200':
          description: Current source message
          content: {application/json: {schema: {$ref: '#/components/schemas/Message'}}}
        '400': {description: Missing or invalid bucket or invalid source key}
        '401': {description: Missing or invalid authentication}
        '403': {description: Membership missing or changed during the request}
        '404': {description: Source deleted, blocked or unavailable}
  /sticker-packs:
    get:
      tags: [Stickers]
      operationId: listStickerPacks
      summary: Browse active sticker packs
      description: |
        Authenticated read-only catalog. Directory pointers are hydrated from pack authority.
        nextCursor follows scanned entries, so an empty filtered page can still have hasNext=true.
        Cover is null when the asset is unavailable. Responses use Cache-Control no-store.
      parameters:
        - {$ref: '#/components/parameters/StickerCursor'}
        - {$ref: '#/components/parameters/StickerLimit'}
      responses:
        '200':
          description: Current catalog page
          content: {application/json: {schema: {$ref: '#/components/schemas/StickerPackPage'}}}
        '400': {description: Invalid cursor or limit}
        '401': {description: Authentication required}
  /sticker-packs/{packId}/stickers:
    get:
      tags: [Stickers]
      operationId: listPackStickers
      summary: Browse active stickers with available images
      description: Cursor is bound to this pack. Stale ordering pointers, inactive stickers and unavailable images are skipped; continue with nextCursor even on an empty page.
      parameters:
        - {$ref: '#/components/parameters/StickerPackId'}
        - {$ref: '#/components/parameters/StickerCursor'}
        - {$ref: '#/components/parameters/StickerLimit'}
      responses:
        '200':
          description: Current sticker page; Cache-Control no-store
          content: {application/json: {schema: {$ref: '#/components/schemas/StickerPage'}}}
        '400': {description: Invalid pack ID, cursor or limit}
        '401': {description: Authentication required}
        '404': {description: Missing or inactive pack}
  /admin/sticker-packs:
    get:
      tags: [Admin, Stickers]
      operationId: adminListStickerPacks
      summary: Inspect active and inactive sticker packs
      description: Requires global SYSTEM_OPERATE permission. A room role is not sufficient. This GET only reads; mutations use the command endpoints below.
      parameters:
        - {$ref: '#/components/parameters/StickerCursor'}
        - {$ref: '#/components/parameters/StickerLimit'}
      responses:
        '200':
          description: Catalog inspection page; Cache-Control no-store
          content: {application/json: {schema: {$ref: '#/components/schemas/StickerPackPage'}}}
        '400': {description: Invalid cursor or limit}
        '401': {description: Authentication required}
        '403': {description: Global permission required}
    post:
      tags: [Admin, Stickers]
      operationId: createStickerPack
      summary: Create an inactive sticker pack with durable audit
      description: Requires SYSTEM_OPERATE. Client generates commandId and stickerPackId once; retry the exact body with the same IDs after a timeout. A committed replay returns its original snapshot. No seeded artwork.
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/CreateStickerPack'}}}
      responses:
        '200': {$ref: '#/components/responses/StickerMutation'}
        '400': {description: Invalid request or unavailable/unsupported asset}
        '401': {description: Authentication required}
        '403': {description: Global permission or asset ownership required}
        '409': {description: ID conflict, reused command, or image deletion already claimed}
  /admin/sticker-packs/{packId}:
    get:
      tags: [Admin, Stickers]
      operationId: adminGetStickerPack
      summary: Reload one authoritative pack without scanning the catalog
      description: Requires global SYSTEM_OPERATE. Read current revision and cover identity, including when the image itself is unavailable. Cache-Control no-store.
      parameters: [{$ref: '#/components/parameters/StickerPackId'}]
      responses:
        '200':
          description: Current authoritative pack
          content: {application/json: {schema: {$ref: '#/components/schemas/StickerPack'}}}
        '400': {description: Invalid pack ID}
        '401': {description: Authentication required}
        '403': {description: Global permission required}
        '404': {description: Missing pack}
    put:
      tags: [Admin, Stickers]
      operationId: updateStickerPack
      summary: Edit or activate/deactivate a sticker pack
      description: Requires SYSTEM_OPERATE, expected pack revision and audit reason. Activation requires explicit human artwork review; not an automatic detector. Command results are historical snapshots; refresh after save. No hard deletion.
      parameters: [{$ref: '#/components/parameters/StickerPackId'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/UpdateStickerPack'}}}
      responses:
        '200': {$ref: '#/components/responses/StickerMutation'}
        '400': {description: Invalid request, review confirmation missing or unavailable image}
        '401': {description: Authentication required}
        '403': {description: Global permission or new asset ownership required}
        '404': {description: Missing pack}
        '409': {description: Stale revision, reused command or deletion conflict; preserve draft and reload}
  /admin/sticker-packs/{packId}/stickers:
    get:
      tags: [Admin, Stickers]
      operationId: adminListPackStickers
      summary: Inspect active and inactive stickers
      description: Requires global SYSTEM_OPERATE. Unavailable images are null, never fabricated URLs. Cursor belongs to this pack; follow nextCursor across empty filtered pages.
      parameters:
        - {$ref: '#/components/parameters/StickerPackId'}
        - {$ref: '#/components/parameters/StickerCursor'}
        - {$ref: '#/components/parameters/StickerLimit'}
      responses:
        '200':
          description: Inspection page; Cache-Control no-store
          content: {application/json: {schema: {$ref: '#/components/schemas/StickerPage'}}}
        '400': {description: Invalid pack ID, cursor or limit}
        '401': {description: Authentication required}
        '403': {description: Global permission required}
        '404': {description: Missing pack}
    post:
      tags: [Admin, Stickers]
      operationId: createSticker
      summary: Add owned artwork to a pack
      description: Requires SYSTEM_OPERATE and expected pack revision. Artwork is permanently retained for history. READY raster images up to 2MB/1024px only; activating requires human artwork review. PENDING scan status is not claimed clean.
      parameters: [{$ref: '#/components/parameters/StickerPackId'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/CreateSticker'}}}
      responses:
        '200': {$ref: '#/components/responses/StickerMutation'}
        '400': {description: Invalid request or unsupported/unavailable/unreviewed image}
        '401': {description: Authentication required}
        '403': {description: Global permission or asset ownership required}
        '404': {description: Missing pack}
        '409': {description: Stale pack revision, ID conflict, reused command or deletion conflict}
  /admin/sticker-packs/{packId}/stickers/{stickerId}:
    get:
      tags: [Admin, Stickers]
      operationId: getAdminSticker
      summary: Read current sticker for conflict comparison
      description: Requires SYSTEM_OPERATE. Bounded authoritative point reads, no-store. Pack revision is checked before and after reading the sticker; a concurrent catalog edit returns 409 rather than a mixed version. Unavailable artwork is null, not a replacement file.
      parameters:
        - {$ref: '#/components/parameters/StickerPackId'}
        - {name: stickerId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Current sticker and the corresponding expected pack revision
          content:
            application/json:
              schema:
                type: object
                required: [packRevision, sticker]
                properties:
                  packRevision: {type: string, format: uuid}
                  sticker: {$ref: '#/components/schemas/Sticker'}
        '400': {description: Invalid ID}
        '401': {description: Authentication required}
        '403': {description: Global permission required}
        '404': {description: Missing pack or sticker}
        '409': {description: Catalog changed during reload; retry the read}
    put:
      tags: [Admin, Stickers]
      operationId: updateSticker
      summary: Rename, reorder or activate/deactivate a sticker
      description: Requires SYSTEM_OPERATE and expected pack revision. Asset and pack identity are immutable; create a new sticker for different artwork. Deactivation works even when artwork is unavailable. Ordering and audit commit in the same conditional partition batch.
      parameters:
        - {$ref: '#/components/parameters/StickerPackId'}
        - {name: stickerId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/UpdateSticker'}}}
      responses:
        '200': {$ref: '#/components/responses/StickerMutation'}
        '400': {description: Invalid request or unavailable/unreviewed artwork for activation}
        '401': {description: Authentication required}
        '403': {description: Global permission required}
        '404': {description: Missing pack or sticker}
        '409': {description: Stale pack revision, reused command or deletion conflict}
  /notifications/channels:
    get:
      tags: [Notifications]
      operationId: getMyNotificationChannels
      summary: Runtime email capability for the authenticated account
      description: No secrets or recipient addresses are returned. Cache-Control is no-store. Email currently requires an explicit server-side recipient allowlist.
      responses:
        '200':
          description: Current account channel availability, not a delivery guarantee
          content:
            application/json:
              schema:
                type: object
                required: [emailAvailable, emailMode, webhookConfigured]
                properties:
                  emailAvailable: {type: boolean}
                  emailMode: {type: string, enum: [ALLOWLIST]}
                  webhookConfigured: {type: boolean}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /notifications/email-history:
    get:
      tags: [Notifications]
      operationId: listMyNotificationEmailHistory
      summary: Email delivery history for the signed-in account
      description: UTC notification month, newest notification first. Cursor is scoped to the authenticated user and month. A page may be empty and still have a continuation because only notifications with an email ledger row are returned. SENT means accepted by the provider, not delivered. Cache-Control is no-store.
      parameters:
        - {name: month, in: query, schema: {type: string, pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$'}, description: Defaults to the current UTC month}
        - {name: cursor, in: query, schema: {type: string, maxLength: 160}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 50, default: 20}}
      responses:
        '200':
          description: Redacted delivery history
          content:
            application/json:
              schema:
                type: object
                required: [content, hasNext]
                properties:
                  content:
                    type: array
                    items:
                      type: object
                      required: [notificationId, status]
                      properties:
                        notificationId: {type: string, format: uuid}
                        status: {type: string, enum: [PENDING, SENDING, RETRY, SENT, DELAYED, DELIVERED, FAILED, BOUNCED, COMPLAINED, SUPPRESSED, SKIPPED, REVIEW_REQUIRED, UNKNOWN]}
                        attemptedAt: {type: string, format: date-time, nullable: true}
                        deliveredAt: {type: string, format: date-time, nullable: true}
                  nextCursor: {type: string, nullable: true}
                  hasNext: {type: boolean}
        '400': {description: Invalid month, limit or cursor}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /webhooks/resend:
    post:
      tags: [Notifications]
      operationId: receiveResendWebhook
      summary: Receive signed Resend delivery events
      security: []
      description: |
        Requires Svix HMAC-SHA256 verification over the untouched raw body and an attempt timestamp within 300 seconds.
        Supports email.sent, email.delivery_delayed, email.delivered, email.failed, email.bounced,
        email.complained and email.suppressed. Duplicate or older events cannot downgrade delivery state.
        Unrelated emails or unsupported event types are acknowledged without persistence.
        This is not a user email-send endpoint. Payload limit is 64 KiB.
      parameters:
        - {name: svix-id, in: header, required: true, schema: {type: string, maxLength: 256}}
        - {name: svix-timestamp, in: header, required: true, schema: {type: string}}
        - {name: svix-signature, in: header, required: true, schema: {type: string, maxLength: 4096}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, created_at, data]
              properties:
                type: {type: string}
                created_at: {type: string, format: date-time}
                data:
                  type: object
                  properties:
                    email_id: {type: string, format: uuid}
                    to: {type: array, items: {type: string, format: email}}
                    tags:
                      type: object
                      properties:
                        noi_user: {type: string, format: uuid}
                        noi_month: {type: string, pattern: '^\d{4}-\d{2}$'}
                        noi_notification: {type: string, format: uuid}
      responses:
        '204': {description: Persisted or safely ignored; no response body}
        '400': {description: Signed but invalid payload or mismatched delivery identity}
        '401': {description: Missing, expired or invalid signature}
        '413': {description: Payload exceeds 64 KiB}
        '503': {description: Webhook secret missing, delivery authority absent or compare-and-set contention; retry later}
  /me/join-requests:
    get:
      tags: [Invites]
      operationId: listMyJoinRequests
      summary: Page the authenticated user's invite and community approval requests
      description: |
        Identity comes from the session, never a userId parameter. Cursor includes both
        clustering keys. Status is read from the invite manager authority or current
        community claim; superseded community attempts use terminal history only.
        RETRY_REQUIRED means the authoritative outcome cannot be confirmed.
        Invitation tokens and manager identities are never returned.
      parameters:
        - {name: cursor, in: query, schema: {type: string, maxLength: 128}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 50, default: 25}}
      responses:
        '200':
          description: Own request page
          content:
            application/json:
              schema:
                type: object
                required: [content, nextCursor, hasNext]
                properties:
                  nextCursor: {type: [string, 'null']}
                  hasNext: {type: boolean}
                  content:
                    type: array
                    items:
                      type: object
                      required: [conversationId, requestedAt, requestedOn, requestId, linkId, status, resolvedAt]
                      properties:
                        conversationId: {type: string, format: uuid}
                        requestedAt: {type: string, format: uuid}
                        requestedOn: {type: string, format: date-time}
                        requestId: {type: string, format: uuid}
                        linkId: {type: [string, 'null'], format: uuid}
                        status: {type: string, enum: [PENDING, APPROVING, APPROVED, DECLINED, CANCELLED, FAILED, RETRY_REQUIRED]}
                        resolvedAt: {type: [string, 'null'], format: date-time}
        '400': {description: Invalid cursor or limit}
        '401': {description: Authentication required}
