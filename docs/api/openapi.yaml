    MemberNotificationPolicy: {type: object, required: [notificationOverride], properties: {notificationOverride: {type: string, enum: [INHERIT, ALL, MENTIONS, NONE]}}}
    ConversationNotificationPolicyView: {type: object, required: [defaultNotificationLevel, notificationOverride], properties: {defaultNotificationLevel: {type: string, enum: [ALL, MENTIONS, NONE]}, notificationOverride: {type: string, enum: [INHERIT, ALL, MENTIONS, NONE]}}}
    MessageSend: {type: object, required: [clientMessageId], properties: {clientMessageId: {type: string, format: uuid}, messageType: {type: string}, content: {type: string, maxLength: 20000}, contentFormat: {type: string}, attachments: {type: array}}}
    Message: {type: object, required: [conversationId, messageBucket, messageId, senderId, messageType, contentFormat, isDeleted, hasAttachments, hasMentions, isPinned, createdAt], properties: {conversationId: {type: string, format: uuid}, messageBucket: {type: string}, messageId: {type: string, format: uuid}, clientMessageId: {type: string, format: uuid, nullable: true}, senderId: {type: string, format: uuid}, messageType: {type: string}, content: {type: string}, contentFormat: {type: string}, replyToMessageId: {type: string, format: uuid, nullable: true}, replyToSenderId: {type: string, format: uuid, nullable: true}, stickerId: {type: string, format: uuid, nullable: true}, pollId: {type: string, format: uuid, nullable: true}, systemEventId: {type: string, format: uuid, nullable: true}, forwardedFromConversationId: {type: string, format: uuid, nullable: true}, forwardedFromMessageBucket: {type: string, nullable: true}, forwardedFromMessageId: {type: string, format: uuid, nullable: true}, isDeleted: {type: boolean}, deletedBy: {type: string, format: uuid, nullable: true}, deletedAt: {type: string, format: date-time, nullable: true}, editedAt: {type: string, format: date-time, nullable: true}, hasAttachments: {type: boolean}, hasMentions: {type: boolean}, isPinned: {type: boolean}, createdAt: {type: string, format: date-time}}}
    MessagePage: {type: object, required: [content, hasNext], properties: {content: {type: array, items: {$ref: '#/components/schemas/Message'}}, nextCursor: {type: string}, hasNext: {type: boolean}}}
    MessageSearchPage: {type: object, required: [content], properties: {content: {type: array, items: {$ref: '#/components/schemas/MessageSearchResult'}}, nextCursor: {type: string, nullable: true}}}
    MessageSearchResult: {type: object, required: [messageId, conversationId, messageBucket, senderId, content], properties: {messageId: {type: string, format: uuid}, conversationId: {type: string, format: uuid}, messageBucket: {type: string}, senderId: {type: string, format: uuid}, replyToSenderId: {type: string, format: uuid, nullable: true}, mentionedUserIds: {type: array, items: {type: string, format: uuid}, nullable: true}, messageType: {type: string}, content: {type: string}, hasAttachments: {type: boolean}, isPinned: {type: boolean}, isDeleted: {type: boolean}, createdAt: {type: string, format: date-time}}}
    PollCreate: {type: object, required: [conversationId, clientMessageId, question, options], properties: {conversationId: {type: string, format: uuid}, clientMessageId: {type: string, format: uuid}, question: {type: string}, options: {type: array, minItems: 2, maxItems: 10, items: {type: string}}}}
    InviteCreate: {type: object, required: [conversationId], properties: {conversationId: {type: string, format: uuid}, inviteKind: {type: string, enum: [LINK, QR]}, joinPolicy: {type: string, enum: [DIRECT_JOIN, REQUEST_APPROVAL]}, maxUses: {type: integer}, expiresAt: {type: string, format: date-time}}}
    InviteConsume: {type: object, required: [linkToken], properties: {linkToken: {type: string}}}
    JoinRequestDecision: {type: object, required: [requestedAt, decision], properties: {requestedAt: {type: string, format: uuid}, decision: {type: string, enum: [APPROVE, DECLINE]}, reason: {type: string}}}
    AppRoleMutation: {type: object, required: [roleCode, reason], properties: {roleCode: {type: string}, expiresAt: {type: string, format: date-time}, reason: {type: string, minLength: 1, maxLength: 500}}}
    MessageSearch: {type: object, properties: {conversationId: {type: string, format: uuid}, q: {type: string}, senderId: {type: string, format: uuid}, replyToSenderId: {type: string, format: uuid}, mentionUserId: {type: string, format: uuid}, messageType: {type: string}, fromAt: {type: string, format: date-time}, toAt: {type: string, format: date-time}, hasAttachment: {type: boolean}, isPinned: {type: boolean}, pageCursor: {type: string}, limit: {type: integer, minimum: 1, maximum: 100}}}
    NotificationPage: {type: object, required: [content, hasNext, hasContent], properties: {content: {type: array, items: {$ref: '#/components/schemas/NotificationView'}}, hasNext: {type: boolean}, hasContent: {type: boolean}}}
