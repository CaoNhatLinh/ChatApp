    ConversationRoleRequest: {type: object, properties: {roleCode: {type: string}, displayName: {type: string}, colorHex: {type: string}, permissionCodes: {type: array, items: {type: string}}, isDefault: {type: boolean}, rolePosition: {type: integer}}}
    ConversationChatPolicy: {type: object, required: [chatMode], properties: {chatMode: {type: string, enum: [OPEN, READ_ONLY, MANAGERS_ONLY]}, slowModeSeconds: {type: integer, minimum: 0, maximum: 86400}}}
    MemberChatPolicy: {type: object, properties: {mutedUntil: {type: string, format: date-time, nullable: true}, messageIntervalSeconds: {type: integer, minimum: 0, maximum: 604800, nullable: true}, reason: {type: string, maxLength: 500}}}
