      type: object
      required: [assetId, applicable, variants]
      properties:
        assetId: {type: string, format: uuid}
        applicable: {type: boolean}
        variants: {type: array, maxItems: 3, items: {$ref: '#/components/schemas/MediaThumbnail'}}
    MediaUploadedFile:
      type: object
