  /files/upload:
    post:
      tags: [Files]
      description: |
        Authenticated upload, available only when Cloudinary is configured. Each file
        must contain 1 to 10485760 actual bytes and have an allowed MIME type. JPEG,
        PNG, GIF and WebP receive a MIME/header and canvas preflight before provider IO:
        maximum 16384 pixels per edge and 25000000 pixels per canvas/first frame.
        This preflight is not full-image decoding, animation-work validation, malware
        scanning or moderation. Cloudinary remains responsible for full decoding.
        Images request synchronous eager SMALL/MEDIUM/LARGE (320/768/1280 edge)
        static PNG first-frame derivatives. Each result is persisted as READY,
        FAILED or UNAVAILABLE; no URL is manufactured for missing/invalid results.
        thumbnailUrl is populated only from a validated READY SMALL result.
        The original can remain usable if a thumbnail fails. A PENDING intent is
        claimed before provider IO. Original metadata and its immutable receipt
        transition to READY in one conditional asset update; thumbnail rows are
        repaired from that receipt. Optional uploadId binds this owner's exact
        file name, MIME, actual size and SHA256 to stable asset/attachment/provider
        identities. Same-ID changes return409. Completed retries return the stored
        receipt without provider upload and do not reset history retention/deletion.
        Without uploadId every call starts a new intent; callers must retain IDs
        to recover a lost acknowledgement. New COMPOSER intents may be cleaned up
        after the configured grace period if still unreferenced.
      parameters:
        - {name: purpose, in: query, schema: {type: string, enum: [GENERAL, COMPOSER], default: GENERAL}}
      requestBody: {required: true, content: {multipart/form-data: {schema: {type: object, required: [file], properties: {file: {type: string, format: binary}, uploadId: {type: string, format: uuid, description: Optional nonzero UUID retained for this exact upload intent.}}}}}}
      responses:
        '201': {description: Uploaded asset and explicit derivative outcomes, content: {application/json: {schema: {$ref: '#/components/schemas/MediaUploadResponse'}}}}
        '400': {description: Missing file, unsupported MIME, invalid image header or exceeded byte/canvas limit}
        '409': {description: Upload ID is bound to other file data or the asset is unavailable/deleting/deleted/quarantined}
  /files/upload/multiple:
    post:
      tags: [Files]
      description: |
        One to ten sequential uploads, each with the same byte and image preflight
        as /files/upload. This operation is not atomic: an earlier upload may have
        completed before a later file fails. Optional repeated uploadIds must have
        one distinct nonzero UUID per file, in file order; identity validation
        finishes before starting any upload. Per-file retry semantics match the
        single upload endpoint.
      parameters:
        - {name: purpose, in: query, schema: {type: string, enum: [GENERAL, COMPOSER], default: GENERAL}}
      requestBody: {required: true, content: {multipart/form-data: {schema: {type: object, required: [files], properties: {files: {type: array, minItems: 1, maxItems: 10, items: {type: string, format: binary}}, uploadIds: {type: array, minItems: 1, maxItems: 10, uniqueItems: true, items: {type: string, format: uuid}}}}}}}
      responses: {'201': {description: Uploaded assets, content: {application/json: {schema: {$ref: '#/components/schemas/MediaUploadResponse'}}}}}
  /files/uploads/{uploadId}:
    get:
      tags: [Files]
      operationId: getOwnedUploadIntent
      summary: Inspect one authenticated owner's known upload intent without provider IO
      description: |
        No-store point lookup. Other owners cannot use the same uploadId to read
        this intent. PENDING and unavailable states have file=null; READY requires
        a valid stored receipt matching current asset authority. A malformed or
        missing receipt/storage failure is an error, not a successful pending state.
        Inspection never uploads, generates derivatives or repairs projections.
      parameters: [{name: uploadId, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        '200': {description: Current upload facts, content: {application/json: {schema: {$ref: '#/components/schemas/MediaUploadInspection'}}}}
        '400': {description: Invalid or reserved zero upload ID}
        '404': {description: No upload intent belonging to this actor}
  /files/{assetId}/thumbnails:
    get:
      tags: [Files]
      operationId: getOwnedMediaThumbnails
      summary: Inspect persisted thumbnail outcomes for an owned ready upload
      description: |
        Uses only the authenticated actor; another user's asset returns 403.
        Missing, non-ready and deleted uploads return 404. No provider call or
        generation is triggered. applicable=false with an empty list means a
        non-image upload. For an image, missing variants mean unavailable metadata,
        never inferred processing or success. This is not a historical recipient
        access route. Cache-Control no-store. Available only when Cloudinary is enabled.
      parameters: [{name: assetId, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        '200': {description: Persisted facts only, content: {application/json: {schema: {$ref: '#/components/schemas/MediaThumbnailView'}}}}
        '400': {description: Invalid asset identifier}
        '401': {description: Authentication required}
        '403': {description: Asset not owned by the authenticated actor}
        '404': {description: Asset absent, unavailable or deleted}
  /files/{assetId}:
    delete:
      tags: [Files]
      parameters: [{name: assetId, in: path, required: true, schema: {type: string, format: uuid}}]
      responses: {'204': {description: Asset deleted}}
  /search/messages:
    post:
      tags: [Search]
      description: Bounded candidate page with authoritative message/pin filtering. Content may be empty while nextCursor remains available; clients must allow continuation in that state.
      requestBody: {content: {application/json: {schema: {$ref: '#/components/schemas/MessageSearch'}}}}
      responses: {'200': {description: Search page, content: {application/json: {schema: {$ref: '#/components/schemas/MessageSearchPage'}}}}}
  /admin/overview:
    get:
      tags: [Admin]
      summary: Return the authenticated administrator's capabilities
      responses: {'200': {description: Admin capability snapshot, content: {application/json: {schema: {$ref: '#/components/schemas/AdminOverview'}}}}}
  /admin/audit:
    get:
      tags: [Admin]
      summary: List bounded global audit events for a UTC month
      parameters:
        - {name: month, in: query, schema: {type: string, pattern: '^\d{4}-\d{2}$'}}
        - {$ref: '#/components/parameters/Limit'}
      responses: {'200': {description: Audit events, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/AdminAuditEvent'}}}}}}
  /admin/audit/export:
    get:
      tags: [Admin]
      summary: Export a bounded UTC-month audit timeline as CSV
      parameters:
        - {name: month, in: query, schema: {type: string, pattern: '^\d{4}-\d{2}$'}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 200}}
      responses:
        '200': {description: UTF-8 CSV audit export, content: {text/csv: {schema: {type: string, format: binary}}}}
  /admin/analytics:
    get:
      tags: [Admin]
      summary: Read bounded daily analytics aggregates
      parameters:
        - {name: from, in: query, schema: {type: string, format: date}}
        - {name: to, in: query, schema: {type: string, format: date}}
        - {name: eventType, in: query, schema: {type: string, enum: [ALL, ROOM_CREATED, ROOM_JOINED, MESSAGE_SENT, POLLS_CREATED, POLL_VOTED, CALL_STARTED], default: ALL}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 2000, default: 200}}
      responses: {'200': {description: Bounded analytics points, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/AdminAnalyticsPoint'}}}}}}
  /reports:
    post:
      tags: [Moderation]
      summary: Submit a manual report for human review
      description: |
        New conversation and message reports require current conversation membership. Members can report archived conversations and their remaining messages. Message authors are resolved by the server. Deleted messages are unavailable for new reports.
        A retry after an uncertain response should send the same Idempotency-Key and payload. Keys are scoped to the authenticated reporter. A successful retry returns the original report identity with its current status. Use a new key for a new report.
        Once an authorized keyed submission is prepared, the server can finish creating it in the background even if the connection drops.
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema: {type: string, format: uuid}
          description: Client-generated UUID for this submission. Requests without a key create a new report each time.
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CreateReport'}}}}
      responses:
        '201':
          description: Created report or the existing report for the same keyed submission
          content: {application/json: {schema: {$ref: '#/components/schemas/AdminReport'}}}
        '400': {description: Invalid key or invalid or mixed target fields}
        '403': {description: Conversation membership required}
        '404': {description: Target unavailable}
        '409': {description: The reporter is the target account or message author, or the key was used for a different report payload}
  /reports/mine:
    get:
      tags: [Moderation]
      parameters: [{$ref: '#/components/parameters/Limit'}]
      responses: {'200': {description: Reports submitted by the authenticated user}}
  /admin/reports:
    get:
      tags: [Admin]
      summary: List reports for one bounded UTC day
      parameters:
        - {name: status, in: query, schema: {type: string, enum: [OPEN, IN_REVIEW, RESOLVED, DISMISSED], default: OPEN}}
        - {name: day, in: query, schema: {type: string, format: date}}
        - {$ref: '#/components/parameters/Limit'}
      responses: {'200': {description: Moderation queue}}
  /admin/reports/{reportId}:
    get:
      tags: [Admin]
      summary: Read one report by its exact identity
      description: Requires REPORT_MANAGE. Returns the current authoritative status regardless of the queue partition last observed by the operator.
      parameters:
        - {$ref: '#/components/parameters/ReportId'}
        - {name: reporterId, in: query, required: true, schema: {type: string, format: uuid}}
        - {name: createdAtKey, in: query, required: true, schema: {type: string, format: uuid}, description: UUID version 1 (Cassandra timeuuid) from the report queue}
      responses:
        '200':
          description: Current report
          headers:
            Cache-Control: {schema: {type: string, const: no-store}}
          content: {application/json: {schema: {$ref: '#/components/schemas/AdminReport'}}}
        '400': {description: Invalid or missing report identity}
        '401': {description: Authentication required}
        '403': {description: Missing report management permission}
        '404': {description: No report matches the supplied identity}
    put:
      tags: [Admin]
      description: Requires REPORT_MANAGE. Identifies the report by the observed queue status, UTC day, creation timeuuid and report ID. OPEN may move to IN_REVIEW, RESOLVED or DISMISSED; IN_REVIEW may move to RESOLVED or DISMISSED. Terminal reports cannot be reopened through this endpoint.
      parameters: [{$ref: '#/components/parameters/ReportId'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ResolveReport'}}}}
      responses:
        '200': {description: Updated report}
        '400': {description: Invalid input or missing reason or terminal resolution code}
        '403': {description: Missing report management permission}
        '404': {description: No report matches the supplied queue key}
        '409': {description: Requested status transition is not allowed or another decision changed the report}
  /admin/messages/{conversationId}/{messageId}:
    get:
      tags: [Admin]
      summary: Inspect one message and its revision history
      description: Requires AUDIT_READ and a non-empty investigation reason. The read is recorded in the immutable audit timeline; the message bucket is mandatory so the request remains bounded.
      parameters:
        - {$ref: '#/components/parameters/ConversationId'}
        - {$ref: '#/components/parameters/MessageId'}
        - {$ref: '#/components/parameters/Bucket'}
        - {name: reason, in: query, required: true, schema: {type: string, minLength: 1, maxLength: 500}}
      responses:
        '200': {description: Message with bounded revision history, content: {application/json: {schema: {$ref: '#/components/schemas/AdminMessageInspection'}}}}
  /admin/sanctions:
    post:
      tags: [Admin]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/SanctionRequest'}}}}
      responses: {'200': {description: Applied sanction}}
  /admin/users/{userId}/sanctions:
    get:
      tags: [Admin]
      parameters: [{$ref: '#/components/parameters/UserId'}, {$ref: '#/components/parameters/Limit'}]
      responses: {'200': {description: User sanctions}}
  /admin/users/{userId}/sanctions/{sanctionId}:
    delete:
      tags: [Admin]
      parameters: [{$ref: '#/components/parameters/UserId'}, {$ref: '#/components/parameters/SanctionId'}, {name: imposedAt, in: query, required: true, schema: {type: string, format: uuid}}, {name: reason, in: query, required: true, schema: {type: string, maxLength: 500}}]
      responses: {'200': {description: Revoked sanction}}
  /admin/users/{userId}/app-roles:
    get:
      tags: [Admin]
      parameters: [{$ref: '#/components/parameters/UserId'}]
      responses: {'200': {description: Application roles}}
    post:
      tags: [Admin]
      parameters: [{$ref: '#/components/parameters/UserId'}]
      requestBody: {content: {application/json: {schema: {$ref: '#/components/schemas/AppRoleMutation'}}}}
      responses: {'201': {description: Application role assigned}}
  /admin/conversations:
    get:
      tags: [Admin]
      summary: List rooms from the bounded monthly operator directory
      parameters:
        - {name: month, in: query, schema: {type: string, pattern: '^\d{4}-\d{2}$'}}
        - {$ref: '#/components/parameters/Limit'}
      responses:
        '200':
          description: Bounded monthly summaries; avatarUrl is read from canonical room data, not directory artwork. Missing images are null. Image-read failures fail the request.
          headers: {Cache-Control: {schema: {type: string, const: no-store}}}
          content: {application/json: {schema: {type: array, maxItems: 200, items: {$ref: '#/components/schemas/AdminConversationSummary'}}}}
        '403': {description: ROOM_READ required}
  /admin/conversations/{conversationId}:
    get:
      tags: [Admin]
      parameters: [{$ref: '#/components/parameters/ConversationId'}, {$ref: '#/components/parameters/Limit'}]
      responses:
        '200':
          description: Room detail, canonical avatarUrl and bounded member snapshot
          headers: {Cache-Control: {schema: {type: string, const: no-store}}}
          content: {application/json: {schema: {$ref: '#/components/schemas/AdminConversationSummary'}}}
        '403': {description: ROOM_READ required}
        '404': {description: Room unavailable}
    delete:
      tags: [Admin]
      summary: Archive a room globally
      parameters: [{$ref: '#/components/parameters/ConversationId'}, {name: reason, in: query, required: true, schema: {type: string, minLength: 1, maxLength: 500}}]
      responses: {'200': {description: Archived room, content: {application/json: {schema: {$ref: '#/components/schemas/AdminConversationSummary'}}}}}
  /admin/conversations/{conversationId}/restore:
    post:
      tags: [Admin]
      parameters: [{$ref: '#/components/parameters/ConversationId'}, {name: reason, in: query, required: true, schema: {type: string, minLength: 1, maxLength: 500}}]
      responses: {'200': {description: Restored room, content: {application/json: {schema: {$ref: '#/components/schemas/AdminConversationSummary'}}}}}
  /admin/conversations/{conversationId}/chat-policy:
    put:
      tags: [Admin]
      parameters: [{$ref: '#/components/parameters/ConversationId'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AdminChatPolicyMutation'}}}}
      responses: {'200': {description: Updated global room policy, content: {application/json: {schema: {$ref: '#/components/schemas/AdminConversationSummary'}}}}}
  /admin/users/{userId}/app-roles/{roleCode}:
    delete:
      tags: [Admin]
      parameters: [{name: userId, in: path, required: true, schema: {type: string, format: uuid}}, {name: roleCode, in: path, required: true, schema: {type: string}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AppRoleMutation'}}}}
      responses: {'204': {description: Application role revoked}}
  /admin/users/{userId}/sessions:
    get:
      tags: [Admin]
      summary: List bounded refresh sessions for a user
      parameters: [{$ref: '#/components/parameters/UserId'}, {$ref: '#/components/parameters/Limit'}]
      responses: {'200': {description: Refresh session inventory}}
  /admin/users/{userId}/sessions/{tokenId}:
    delete:
      tags: [Admin]
      summary: Revoke one refresh session
      parameters: [{$ref: '#/components/parameters/UserId'}, {$ref: '#/components/parameters/TokenId'}, {name: reason, in: query, required: true, schema: {type: string, minLength: 1, maxLength: 500}}]
      responses: {'204': {description: Session revoked}}
  /admin/users/{userId}/devices:
    get:
      tags: [Admin]
      summary: List bounded registered devices for a user
      parameters: [{$ref: '#/components/parameters/UserId'}, {$ref: '#/components/parameters/Limit'}]
      responses: {'200': {description: Device inventory}}
  /admin/users/{userId}/devices/{deviceId}:
    delete:
      tags: [Admin]
      summary: Revoke one device and its indexed sessions
      parameters: [{$ref: '#/components/parameters/UserId'}, {$ref: '#/components/parameters/DeviceId'}, {name: reason, in: query, required: true, schema: {type: string, minLength: 1, maxLength: 500}}]
      responses: {'204': {description: Device revoked}}
  /devices:
    post:
      tags: [Identity]
      summary: Register or reactivate the authenticated user's device
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/DeviceRegistrationRequest'}}}}
      responses: {'200': {description: Registered device, content: {application/json: {schema: {$ref: '#/components/schemas/DeviceSession'}}}}}
  /devices/{deviceId}/heartbeat:
    post:
      tags: [Identity]
      summary: Update the authenticated device last-seen timestamp
      parameters: [{$ref: '#/components/parameters/DeviceId'}]
      responses: {'204': {description: Device heartbeat accepted}}
  /admin/users/{userId}/status:
    put:
      tags: [Admin]
      summary: Suspend, ban or restore a user account globally
      parameters: [{$ref: '#/components/parameters/UserId'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AdminAccountStatusMutation'}}}}
      responses: {'200': {description: Updated user account status, content: {application/json: {schema: {$ref: '#/components/schemas/AdminAccountStatusResponse'}}}}}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
  headers:
    RefreshCookie:
      description: HttpOnly rotating refresh cookie; Secure is enabled in production.
      schema: {type: string}
    SessionHintCookie:
      description: Non-authorizing startup hint (`novachat_session=1`); it is not a credential and does not grant access.
      schema: {type: string}
  responses:
    CallHistoryPage:
      description: Current authorized history; empty content can still have a scanned-key continuation
      headers: {Cache-Control: {schema: {type: string, const: no-store}}}
      content: {application/json: {schema: {$ref: '#/components/schemas/CallHistoryPage'}}}
    CallHistoryInvalid:
      description: Invalid month, UUID, limit, or malformed/oversized/wrong-scope cursor
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
    CallHistoryForbidden:
      description: Not a current actor member, not a DM, or not an exact historical participant
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
    CallHistoryNotFound:
      description: Conversation or exact call authority unavailable
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
    CallHistoryConflict:
      description: Authority kept changing through bounded expiry retries; reload
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
    CallHistoryUnavailable:
      description: Datastore or authority invariant failed; never interpret this as empty history
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
    StickerMutation:
      description: Committed result or exact replay; Cache-Control no-store. auditPending means durable audit export has not completed, not a failed catalog mutation.
      content: {application/json: {schema: {$ref: '#/components/schemas/StickerMutationResult'}}}
    GoogleAuthConflict:
      description: Email or Google identity is already owned by another canonical account
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
    GoogleAuthUnavailable:
      description: Google is disabled, token verification failed, or account setup requires retry
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
  parameters:
    CallHistoryMonth:
      name: month
      in: query
      required: true
      description: Explicit UTC creation month from 1970-01 through the current UTC month. No future month or automatic cross-month search.
      schema: {type: string, minLength: 7, maxLength: 7, pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$'}
    CallHistoryCursor:
      name: cursor
      in: query
      description: Opaque version/actor/month/own-or-room/full-tuple continuation; do not decode or construct. Not authorization or a snapshot.
      schema: {type: string, maxLength: 1024}
    CallHistoryLimit:
      name: limit
      in: query
      description: Maximum raw discovery keys scanned, including filtered entries.
      schema: {type: integer, minimum: 1, maximum: 50, default: 25}
    StickerPackId: {name: packId, in: path, required: true, schema: {type: string, format: uuid}}
    StickerCursor: {name: cursor, in: query, description: Opaque cursor returned by the preceding page. Do not construct or decode it., schema: {type: string, maxLength: 100}}
    StickerLimit: {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 50, default: 25}}
    UserId: {name: userId, in: path, required: true, schema: {type: string, format: uuid}}
    FriendId: {name: friendId, in: path, required: true, schema: {type: string, format: uuid}}
    ConversationId: {name: conversationId, in: path, required: true, schema: {type: string, format: uuid}}
    MessageId: {name: messageId, in: path, required: true, schema: {type: string, format: uuid}}
    ReportId: {name: reportId, in: path, required: true, schema: {type: string, format: uuid}}
    SanctionId: {name: sanctionId, in: path, required: true, schema: {type: string, format: uuid}}
    TokenId: {name: tokenId, in: path, required: true, schema: {type: string, format: uuid}}
    DeviceId: {name: deviceId, in: path, required: true, schema: {type: string, format: uuid}}
    Bucket: {name: bucket, in: query, required: true, schema: {type: string, pattern: '^\\d{4}-\\d{2}-\\d{2}-\\d{2}:\\d{2}$'}}
    Limit: {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
  schemas:
    AdminConversationSummary:
      type: object
      required: [conversationId, conversationType, visibility, joinPolicy, memberCount, chatMode, slowModeSeconds, deleted, createdAt, updatedAt, members]
      properties:
        conversationId: {type: string, format: uuid}
        conversationType: {type: string}
        visibility: {type: string}
        joinPolicy: {type: string}
        name: {type: [string, 'null']}
        description: {type: [string, 'null']}
        ownerId: {type: [string, 'null'], format: uuid}
        memberCount: {type: integer, minimum: 0}
        chatMode: {type: string, enum: [OPEN, READ_ONLY, MANAGERS_ONLY]}
        slowModeSeconds: {type: integer, minimum: 0, maximum: 86400}
        deleted: {type: boolean}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        avatarUrl: {type: [string, 'null'], description: Optional canonical room identity image; no stock image is substituted.}
        members:
          type: array
          maxItems: 500
          items:
            type: object
            properties:
              userId: {type: string, format: uuid}
              joinedAt: {type: [string, 'null'], format: date-time}
              mutedUntil: {type: [string, 'null'], format: date-time}
              messageIntervalSeconds: {type: [integer, 'null'], minimum: 0}
    SystemSettingMetadata:
      type: object
      required: [revision, updatedBy, updatedAt]
      properties:
        revision: {type: string, format: uuid, description: Opaque CAS token. Zero UUID denotes only an unwritten catalog default, not missing stored metadata.}
        updatedBy: {type: [string, 'null'], format: uuid}
        updatedAt: {type: [string, 'null'], format: date-time}
    SystemSetting:
      oneOf:
        - allOf:
            - {$ref: '#/components/schemas/SystemSettingMetadata'}
            - type: object
              required: [key, type, value, defaultValue, min, max]
              properties:
                key: {const: community.creationEnabled}
                type: {const: BOOLEAN}
                value: {type: boolean}
                defaultValue: {const: true}
                min: {type: 'null'}
                max: {type: 'null'}
        - allOf:
            - {$ref: '#/components/schemas/SystemSettingMetadata'}
            - type: object
              required: [key, type, value, defaultValue, min, max]
              properties:
                key: {const: community.defaultMaxMembers}
                type: {const: INTEGER}
                value: {type: integer, minimum: 2, maximum: 100000}
                defaultValue: {const: 10000}
                min: {const: 2}
                max: {const: 100000}
    SystemSettingUpdate:
      type: object
      required: [commandId, expectedRevision, value, reason]
      properties:
        commandId: {type: string, format: uuid, not: {const: '00000000-0000-0000-0000-000000000000'}}
        expectedRevision: {type: string, format: uuid}
        value:
          description: Boolean for creationEnabled; integral JSON token from2 through100000 for defaultMaxMembers. Strings, null, objects and fractional-number tokens are rejected.
          oneOf: [{type: boolean}, {type: integer, minimum: 2, maximum: 100000}]
        reason: {type: string, minLength: 1, maxLength: 500, description: Whitespace-only reasons are invalid; outer whitespace is stripped.}
    SystemSettingResult:
      type: object
      required: [commandId, setting, auditPending]
      properties:
        commandId: {type: string, format: uuid}
        setting: {$ref: '#/components/schemas/SystemSetting'}
        auditPending: {type: boolean}
    MessageAttachmentPage:
      type: object
      required: [conversationId, messageBucket, messageId, content, hasNext]
      properties:
        conversationId: {type: string, format: uuid}
        messageBucket: {type: string}
        messageId: {type: string, format: uuid}
        content: {type: array, maxItems: 50, items: {$ref: '#/components/schemas/MessageAttachmentView'}}
        nextCursor: {type: [string, 'null'], format: uuid}
        hasNext: {type: boolean}
    MessageAttachmentView:
      type: object
      required: [attachmentId, fileName, mimeType, byteSize, spoiler, status]
      properties:
        attachmentId: {type: string, format: uuid}
        assetId: {type: [string, 'null'], format: uuid}
        fileName: {type: string}
        mimeType: {type: string}
        byteSize: {type: integer, minimum: 0}
        width: {type: [integer, 'null'], minimum: 1}
        height: {type: [integer, 'null'], minimum: 1}
        durationMs: {type: [integer, 'null'], minimum: 0}
        spoiler: {type: boolean}
        status: {type: string, enum: [READY, UNAVAILABLE]}
        url: {type: [string, 'null'], format: uri, description: HTTPS original from READY active asset only}
        thumbnailUrl: {type: [string, 'null'], format: uri, description: Confirmed READY SMALL derivative only}
    MediaThumbnail:
      type: object
      required: [variant, status, createdAt]
      description: READY has a validated HTTPS URL and actual positive dimensions within its variant bound. FAILED/UNAVAILABLE expose no URL or dimensions and no raw provider error. These synchronous outcomes do not imply an asynchronous retry worker.
      properties:
        variant: {type: string, enum: [SMALL, MEDIUM, LARGE]}
        status: {type: string, enum: [READY, FAILED, UNAVAILABLE]}
        url: {type: string, format: uri, nullable: true}
        width: {type: integer, minimum: 1, maximum: 1280, nullable: true}
        height: {type: integer, minimum: 1, maximum: 1280, nullable: true}
        createdAt: {type: string, format: date-time}
