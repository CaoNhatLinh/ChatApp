    FriendRequest: {type: object, required: [recipientId], properties: {recipientId: {type: string, format: uuid}, message: {type: string, maxLength: 500}}}
    FriendAction: {type: object, required: [friendId], properties: {friendId: {type: string, format: uuid}}}
    FriendUserSummary: {type: object, required: [userId, username, displayName, accountStatus], properties: {userId: {type: string, format: uuid}, username: {type: string}, displayName: {type: string}, avatarUrl: {type: string, format: uri, nullable: true}, accountStatus: {type: string}}}
    FriendshipStatus: {type: object, required: [status, userId, userDetails], properties: {status: {type: string}, userId: {type: string, format: uuid}, userDetails: {type: array, items: {$ref: '#/components/schemas/FriendUserSummary'}}}}
    ConversationCreate: {type: object, required: [conversationType], properties: {conversationType: {type: string, enum: [DM, GROUP, CHANNEL]}, name: {type: string}, memberIds: {type: array, items: {type: string, format: uuid}}}}
    Conversation: {type: object, required: [conversationId, conversationType], properties: {conversationId: {type: string, format: uuid}, conversationType: {type: string}, name: {type: string}, memberCount: {type: integer}}}
    ConversationListItem: {type: object, required: [conversation, pinned, unreadCount], properties: {conversation: {$ref: '#/components/schemas/Conversation'}, pinned: {type: boolean}, unreadCount: {type: integer}}}
