  /conversations/{conversationId}/members/{userId}/chat-policy:
    put:
      tags: [Conversations]
      parameters: [{name: conversationId, in: path, required: true, schema: {type: string, format: uuid}}, {name: userId, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody: {content: {application/json: {schema: {$ref: '#/components/schemas/MemberChatPolicy'}}}}
      responses:
        '204': {description: Member policy updated}
        '409': {description: Room owner, membership or chat policy changed before the write}
  /conversations/{conversationId}/members/{userId}/notification-policy:
    put:
      tags: [Conversations]
      parameters: [{name: conversationId, in: path, required: true, schema: {type: string, format: uuid}}, {name: userId, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/MemberNotificationPolicy'}}}}
      responses:
        '204': {description: Member notification override updated}
        '409': {description: Membership or notification override changed before the write}
  /conversations/{conversationId}/messages:
    get:
      tags: [Messages]
      parameters: [{$ref: '#/components/parameters/ConversationId'}, {$ref: '#/components/parameters/Limit'}, {name: cursor, in: query, schema: {type: string, maxLength: 96}}]
      responses:
        '200': {description: Cursor page, content: {application/json: {schema: {$ref: '#/components/schemas/MessagePage'}}}}
        '400': {description: Invalid history cursor}
    post:
      tags: [Messages]
      description: STICKER sends require stickerId, empty PLAIN content and no attachments/poll. New writes validate the current active pack/sticker and available canonical artwork before reserving identity. Authority creation is conditional; a worker losing creation returns the current public message and cannot reset an edit/deletion. The actual authority creator performs initial send effects even if resuming another worker's claim. An unapplied create with missing authority conflicts and ambiguous storage errors remain errors. Already committed exact-payload retries return their original message even after catalog deactivation. For nondeleted messages, matching retries repair frozen attachment references, including ordinary media sends, before acknowledging; failed reference writes remain errors. Deleted authority rows are redacted and do not recreate attachment/source references. This is not an atomic message/media/outbox transaction or a guarantee of recovered notification/realtime side effects. Changed payload/clientMessageId reuse returns 409.
      parameters: [{$ref: '#/components/parameters/ConversationId'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/MessageSend'}}}}
      responses: {'201': {description: Created message, content: {application/json: {schema: {$ref: '#/components/schemas/Message'}}}}}
  /conversations/{conversationId}/messages/{messageId}:
    get:
      tags: [Messages]
      parameters: [{$ref: '#/components/parameters/ConversationId'}, {$ref: '#/components/parameters/MessageId'}, {$ref: '#/components/parameters/Bucket'}]
      responses: {'200': {description: Message}}
    put:
      tags: [Messages]
      description: Sticker messages cannot be edited into arbitrary content; delete and send another sticker instead (400). Other existing edit authorization/revision rules remain unchanged.
      parameters: [{$ref: '#/components/parameters/ConversationId'}, {$ref: '#/components/parameters/MessageId'}, {$ref: '#/components/parameters/Bucket'}]
      requestBody: {content: {application/json: {schema: {type: object, required: [content], properties: {content: {type: string, maxLength: 20000}}}}}}
      responses: {'200': {description: Edited message}}
    delete:
      tags: [Messages]
      description: Sender-authorized tombstone deletion. Releases any pin using the canonical pin revision and exact slot generation; retries of an already deleted message repair remaining pins without repeating the deletion event. A pin operation observing concurrent deletion is compensated and conflicts instead of reporting pinned success. This is not an atomic cross-partition deletion/publication transaction.
      parameters: [{$ref: '#/components/parameters/ConversationId'}, {$ref: '#/components/parameters/MessageId'}, {$ref: '#/components/parameters/Bucket'}]
      responses: {'200': {description: Deleted message}}
  /conversations/{conversationId}/messages/{messageId}/attachments:
    get:
      tags: [Messages]
      operationId: listMessageAttachments
      summary: Read message-scoped attachment availability and confirmed media URLs
      description: Current members only. Deleted/missing messages and blocked senders are unavailable. References are traversed within the exact room/bucket/message partition. URL and thumbnail come from the active READY asset and confirmed SMALL derivative, never client URL reconstruction. UNAVAILABLE entries have no delivery URL. An empty page is not proof that an interrupted attachment write completed. Storage errors remain errors. No provider fetch or mutation.
      parameters:
        - {$ref: '#/components/parameters/ConversationId'}
        - {$ref: '#/components/parameters/MessageId'}
        - {$ref: '#/components/parameters/Bucket'}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 50, default: 25}}
        - {name: cursor, in: query, schema: {type: string, format: uuid}, description: Last returned attachment ID within this message}
      responses:
        '200':
          description: Bounded reference page; READY and UNAVAILABLE are per-file facts
          headers: {Cache-Control: {schema: {type: string, const: no-store}}}
          content: {application/json: {schema: {$ref: '#/components/schemas/MessageAttachmentPage'}}}
        '400': {description: Invalid identity, bucket, limit or cursor}
        '401': {description: Missing or invalid authentication}
        '403': {description: Not a current member}
        '404': {description: Message missing, deleted or blocked}
        '500': {description: Storage failure; not an empty or unavailable success}
  /conversations/{conversationId}/messages/{messageId}/forward-draft:
    get:
      tags: [Messages]
      operationId: prepareMessageForward
      summary: Read a source-authorized snapshot for one forward attempt
      description: |
        Read-only preparation, not a persisted draft or send. Requires current source
        membership and a non-deleted, non-blocked source. Returns its public message and
        at most50 canonical attachment records, preserving metadata including nullable
        size/dimensions. Uses one bounded51-row attachment lookup, never a room-library
        scan. Missing attachment rows or over-limit sources conflict. POLL/SYSTEM has
        no copy runtime and is unavailable. The complete snapshot must be validated
        again by message POST before allocation; this read is not an authorization token.
        Immediate source keys come from this message identity, not any private chain.
      parameters:
        - {$ref: '#/components/parameters/ConversationId'}
        - {$ref: '#/components/parameters/MessageId'}
        - {$ref: '#/components/parameters/Bucket'}
      responses:
        '200':
          description: Current source and complete bounded attachment metadata
          content:
            application/json:
              schema:
                type: object
                required: [message, attachments]
                properties:
                  message: {$ref: '#/components/schemas/Message'}
                  attachments:
                    type: array
                    maxItems: 50
                    items:
                      type: object
                      required: [attachmentId, assetId, storageProvider, storageKey]
                      properties:
                        attachmentId: {type: string, format: uuid}
                        assetId: {type: string, format: uuid}
                        storageProvider: {type: string}
                        storageKey: {type: string}
                        fileName: {type: string, nullable: true}
                        mimeType: {type: string, nullable: true}
                        byteSize: {type: integer, format: int64, nullable: true, minimum: 0}
                        width: {type: integer, nullable: true, minimum: 0}
                        height: {type: integer, nullable: true, minimum: 0}
                        durationMs: {type: integer, format: int64, nullable: true, minimum: 0}
                        thumbnailUrl: {type: string, nullable: true}
                        isSpoiler: {type: boolean, nullable: true}
        '400': {description: Invalid key or unsupported POLL/SYSTEM source}
        '401': {description: Authentication required}
        '404': {description: Source missing, deleted, blocked or inaccessible}
        '409': {description: Source attachments incomplete or exceed50}
  /conversations/{conversationId}/messages/{messageId}/forward-source:
    get:
      tags: [Messages]
      operationId: getForwardSource
      summary: Resolve one immediate forward source for the current viewer
      description: |
        Requires destination membership before any lookup. The source key is loaded only
        from destination message authority, never supplied by the caller. Current source
        membership and sender block/deletion checks are repeated on each request. A missing,
        deleted, blocked or inaccessible source returns available=false with no source data;
        its room ID, name, bucket and message ID are not disclosed. An accessible source is
        its current public message, not a recursive chain or destination-room list. Revocation
        removes navigation, not the already copied destination snapshot. Cache-Control no-store.
      parameters:
        - {$ref: '#/components/parameters/ConversationId'}
        - {$ref: '#/components/parameters/MessageId'}
        - {$ref: '#/components/parameters/Bucket'}
      responses:
        '200':
          description: Current authorized source or an indistinguishable unavailable state
          content:
            application/json:
              schema:
                type: object
                required: [available]
                properties:
                  available: {type: boolean}
                  source: {allOf: [{$ref: '#/components/schemas/Message'}], nullable: true}
        '400': {description: Invalid destination message key}
        '401': {description: Authentication required}
        '403': {description: Destination membership required}
        '404': {description: Destination message missing, deleted, blocked or not forwarded}
  /conversations/{conversationId}/messages/{messageId}/replies:
    get:
      tags: [Messages]
      operationId: listMessageReplies
      summary: Read a bounded page of direct replies to one message
      description: |
        Requires current conversation membership on every request, including continuation.
        The parent ID must be a timeuuid and bucket must be a valid canonical hour/shard00–15.
        Reads the parent index in ascending (created_at timeuuid, message_id timeuuid) order,
        then hydrates canonical messages. Missing/stale/wrong-parent references and messages
        from senders blocked by the actor are excluded. The parent sender is checked too;
        missing/blocked parent returns404, while a soft-deleted parent/child is a public tombstone.
        At most limit index entries are consumed plus one lookahead; a filtered page may be empty
        with hasNext=true. Always follow nextCursor, not the content length. Cursors are opaque,
        bounded, include both clustering keys and are scoped to actor/conversation/parent bucket/ID.
        No total count, nested-descendant aggregation, snapshot isolation or unseen-side-effect
        delivery guarantee is asserted. Concurrent backdated writes may require a refresh.
        Cache-Control no-store. This endpoint does not grant permission to send a new reply.
      parameters:
        - {$ref: '#/components/parameters/ConversationId'}
        - {$ref: '#/components/parameters/MessageId'}
        - {$ref: '#/components/parameters/Bucket'}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 50, default: 25}}
        - {name: cursor, in: query, schema: {type: string, maxLength: 1024}}
      responses:
        '200':
          description: Parent and current authorized direct replies; content may be empty with continuation
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MessageThreadPage'}
        '400': {description: Invalid message key, page limit or cursor scope/shape}
        '401': {description: Missing or invalid authentication}
        '403': {description: Caller is no longer a conversation member}
        '404': {description: Parent is missing or blocked}
  /conversations/{conversationId}/messages/{messageId}/sticker:
    get:
      tags: [Messages, Stickers]
      operationId: getMessageStickerArtwork
      summary: Read retained artwork for an authorized sticker message
      description: Requires current conversation membership and a nondeleted STICKER message. Catalog deactivation does not hide historical artwork. Never accepts an arbitrary sticker ID or image URL. Unavailable/rejected/deleted image is null; missing sticker/message returns 404. Cache-Control no-store. No catalog management privilege required.
      parameters: [{$ref: '#/components/parameters/ConversationId'}, {$ref: '#/components/parameters/MessageId'}, {$ref: '#/components/parameters/Bucket'}]
      responses:
        '200':
          description: Canonical artwork or explicit unavailable image
          content:
            application/json:
              schema:
                type: object
                required: [stickerId, name, image]
                properties:
                  stickerId: {type: string, format: uuid}
                  name: {type: string}
                  image: {oneOf: [{$ref: '#/components/schemas/StickerImage'}, {type: 'null'}]}
        '400': {description: Invalid message identity or bucket}
        '401': {description: Authentication required}
        '403': {description: Not a current conversation member}
        '404': {description: Missing/deleted/non-sticker message or missing retained sticker identity}
  /conversations/{conversationId}/messages/{messageId}/read:
    post:
      tags: [Messages]
      parameters: [{name: conversationId, in: path, required: true, schema: {type: string, format: uuid}}, {name: messageId, in: path, required: true, schema: {type: string, format: uuid}}, {$ref: '#/components/parameters/Bucket'}]
      responses: {'204': {description: Marked read}}
  /conversations/{conversationId}/messages/{messageId}/read-receipts:
    get:
      tags: [Messages]
      parameters: [{name: conversationId, in: path, required: true, schema: {type: string, format: uuid}}, {name: messageId, in: path, required: true, schema: {type: string, format: uuid}}, {$ref: '#/components/parameters/Bucket'}, {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 50, default: 25}}, {name: cursor, in: query, schema: {type: string, format: uuid, nullable: true}}]
      responses: {'200': {description: Bounded read receipts with hydrated profiles, content: {application/json: {schema: {$ref: '#/components/schemas/MessageReadReceiptPage'}}}}}
  /conversations/{conversationId}/messages/{messageId}/revisions:
    get:
      tags: [Messages]
      parameters: [{name: conversationId, in: path, required: true, schema: {type: string, format: uuid}}, {name: messageId, in: path, required: true, schema: {type: string, format: uuid}}, {$ref: '#/components/parameters/Bucket'}]
      responses: {'200': {description: Message revisions}}
  /conversations/{conversationId}/messages/pins:
    get:
      tags: [Messages]
      description: Member-scoped no-store full pin snapshot. Revision is a decimal int64 string, never a JavaScript number. Bounded read repair checks at most five pinned references and releases only proven message tombstones through version-fenced CAS, publishing resulting full snapshots. Missing source rows are not deletion proof. Repair contention may return 409; callers may retry the snapshot lookup.
      parameters: [{$ref: '#/components/parameters/ConversationId'}]
      responses:
        '200': {description: Pin snapshot, content: {application/json: {schema: {$ref: '#/components/schemas/MessagePinState'}}}}
        '403': {description: Membership required}
        '409': {description: Bounded deleted-pin repair conflicted; retry snapshot lookup}
  /conversations/{conversationId}/messages/{messageId}/pin:
    post:
      tags: [Messages]
      parameters: [{name: conversationId, in: path, required: true, schema: {type: string, format: uuid}}, {name: messageId, in: path, required: true, schema: {type: string, format: uuid}}, {$ref: '#/components/parameters/Bucket'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/MessagePinRequest'}}}}
      responses:
        '200': {description: Pin result and full snapshot; an already-desired value is a no-op, content: {application/json: {schema: {$ref: '#/components/schemas/MessagePinMutation'}}}}
        '400': {description: Missing or invalid expected revision}
        '409': {description: Stale intent or pin capacity reached; do not silently replay with a newer revision}
    delete:
      tags: [Messages]
      parameters: [{name: conversationId, in: path, required: true, schema: {type: string, format: uuid}}, {name: messageId, in: path, required: true, schema: {type: string, format: uuid}}, {$ref: '#/components/parameters/Bucket'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/MessagePinRequest'}}}}
      responses:
        '200': {description: Unpin result and full snapshot, content: {application/json: {schema: {$ref: '#/components/schemas/MessagePinMutation'}}}}
        '400': {description: Missing or invalid expected revision}
        '409': {description: Pin state changed; reload before a new intent}
  /conversations/{conversationId}/messages/{messageId}/reactions:
    post:
      tags: [Messages]
      parameters: [{$ref: '#/components/parameters/ConversationId'}, {$ref: '#/components/parameters/MessageId'}, {$ref: '#/components/parameters/Bucket'}]
      requestBody: {content: {application/json: {schema: {type: object, required: [emoji], properties: {emoji: {type: string, maxLength: 8}}}}}}
