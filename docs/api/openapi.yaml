        '401': {description: Firebase token is invalid, revoked, or is not a verified Google identity, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
        '409': {$ref: '#/components/responses/GoogleAuthConflict'}
