        conversationId: {type: string, format: uuid}
        callId: {type: string, format: uuid}
        callerId: {type: string, format: uuid}
        calleeId: {type: string, format: uuid}
        callType: {type: string, enum: [VOICE, VIDEO]}
        status: {type: string, enum: [RINGING, ACCEPTED, CANCELLED, DECLINED, MISSED, ENDED, FAILED]}
        createdAt: {type: string, format: date-time}
        acceptedAt: {type: [string, 'null'], format: date-time}
        endedAt: {type: [string, 'null'], format: date-time}
        deadline: {type: string, format: date-time}
        revision: {type: string, format: uuid}
        version: {type: integer, minimum: 1}
