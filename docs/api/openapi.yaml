    CallHistoryPage:
      type: object
      additionalProperties: false
      required: [content, nextCursor, hasNext]
      properties:
        content: {type: array, maxItems: 50, items: {$ref: '#/components/schemas/CallHistoryEntry'}}
        nextCursor: {type: [string, 'null'], maxLength: 1024, description: Scanned-key continuation when hasNext is true; null when exhausted.}
        hasNext: {type: boolean, description: Follow the cursor even for an empty content array.}
    CallHistoryEntry:
      type: object
      additionalProperties: false
      description: Latest authorized signaling facts. ACCEPTED means consent, not proven media; ENDED is not measured talk duration. No heartbeat, provider, profile or device fields.
      required: [conversationId, callId, callerId, calleeId, callType, direction, outcome, createdAt, acceptedAt, endedAt, version, participants]
      properties:
        conversationId: {type: string, format: uuid}
        callId: {type: string, format: uuid}
        callerId: {type: string, format: uuid}
        calleeId: {type: string, format: uuid}
        callType: {type: string, enum: [VOICE, VIDEO]}
        direction: {type: string, enum: [INCOMING, OUTGOING]}
        outcome: {type: string, enum: [RINGING, ACCEPTED, CANCELLED, DECLINED, MISSED, UNANSWERED, ENDED, FAILED], description: Authority MISSED maps to MISSED only for the callee and UNANSWERED for the caller.}
        createdAt: {type: string, format: date-time}
        acceptedAt: {type: [string, 'null'], format: date-time}
        endedAt: {type: [string, 'null'], format: date-time}
        version: {type: integer, minimum: 1}
        participants: {type: array, minItems: 2, maxItems: 2, items: {$ref: '#/components/schemas/CallHistoryParticipant'}}
    CallHistoryParticipant:
      type: object
      additionalProperties: false
      description: Exact caller/callee facts from authority, not media join/leave attendance.
      required: [userId, role, initiatedAt, acceptedAt]
      properties:
        userId: {type: string, format: uuid}
        role: {type: string, enum: [CALLER, CALLEE]}
        initiatedAt: {type: [string, 'null'], format: date-time, description: Creation time for caller only; null for callee.}
        acceptedAt: {type: [string, 'null'], format: date-time, description: Consent time for callee only; null for caller.}
    IncomingCallPage:
      type: object
      additionalProperties: false
      required: [content, nextCursor, hasNext]
      description: Live incoming discovery page ordered by deadline, conversation ID and call ID. Continuation follows the last scanned key, including filtered keys. No total count or frozen snapshot is provided.
      properties:
        content:
          type: array
          maxItems: 50
          items: {$ref: '#/components/schemas/CallSnapshot'}
        nextCursor:
          type: [string, 'null']
          maxLength: 1024
          description: Opaque continuation when hasNext is true; null when exhausted. Expires 60 seconds after the initial lookup.
        hasNext:
          type: boolean
          description: A complete raw page was scanned; continue even if content is empty. The next page may be empty.
    CallSnapshot:
      type: object
      additionalProperties: false
      required: [conversationId, callId, callerId, calleeId, callType, status, createdAt, acceptedAt, endedAt, deadline, revision, version]
      description: Public authority snapshot shared with the STOMP contract. Acceptance is consent/signaling, not verified media connection. Terminal fields support historical use but the active endpoint only returns nonterminal snapshots.
